spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/employee_db
    username: root
    password: root

  # Flyway для dev: чистим БД при каждом старте и применяем ВСЕ миграции
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
    clean-disabled: false   # Разрешаем clean
    baseline-on-migrate: true

  #sql:
    #init:
      #mode: always

  jpa:
    #show-sql: true
    #hibernate:
    #ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: DEBUG
